[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogito-engine"
version = "0.1.2"
description = "Multi-agent cognitive flow in applicable, easy assembly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
cogito = "cogito.cli:main"

[tool.setuptools.packages.find]
include = ["cogito*"]
